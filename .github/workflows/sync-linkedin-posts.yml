name: Sync LinkedIn posts

on:
  schedule:
    # Refresh twice daily so new LinkedIn posts appear automatically
    - cron: "15 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Sync posts from LinkedIn RSS
        env:
          LINKEDIN_RSS_FEED_URL: ${{ secrets.LINKEDIN_RSS_FEED_URL }}
        run: node scripts/sync-linkedin-posts.js

      - name: Commit updated posts
        run: |
          if git diff --quiet -- src/content/linkedin_posts.json; then
            echo "No LinkedIn post changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/linkedin_posts.json
          git commit -m "chore: sync LinkedIn posts for blog"
          git push
